    <script>
        AFRAME.registerComponent('mouse-cursor-tracker', {
            init: function () {
                this.mouse = new THREE.Vector2();
                this.cameraEl = document.querySelector('#camera-jogador');
                
                window.addEventListener('mousemove', (e) => {
                    this.mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    this.mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                });
            },
            tick: function () {
                if (this.el.sceneEl.is('vr-mode')) {
                    this.el.object3D.position.set(0, 0, -1);
                    return;
                }
                
                var cam = this.cameraEl.getObject3D('camera');
                if(cam) {
                    var fov = cam.fov * Math.PI / 180;
                    var aspect = cam.aspect;
                    var z = -1.5; 
                    var h = 2 * Math.tan(fov / 2) * Math.abs(z);
                    var w = h * aspect;
                    
                    this.el.object3D.position.x += ((this.mouse.x * w/2) - this.el.object3D.position.x) * 0.4;
                    this.el.object3D.position.y += ((this.mouse.y * h/2) - this.el.object3D.position.y) * 0.4;
                    this.el.object3D.position.z = z;
                }
            }
        });

        function texturaGridNeon(corLinha) {
            var c = document.createElement('canvas');
            c.width = 256; 
            c.height = 256;
            var ctx = c.getContext('2d');
            ctx.fillStyle = '#05010f';
            ctx.fillRect(0, 0, 256, 256);
            ctx.strokeStyle = corLinha;
            ctx.lineWidth = 4;
            ctx.shadowColor = corLinha;                
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.moveTo(0, 0); ctx.lineTo(256, 0);
            ctx.moveTo(0, 0); ctx.lineTo(0, 256);
            ctx.stroke();
            return c.toDataURL();
        }

        AFRAME.registerComponent('piso-neon', {
            schema: { cor: { default: '#00fff2' }, repeat: { default: '8 8' } },
            init: function () {
                this.aplicarTextura();
            },
            update: function (oldData) {
                if (oldData.cor !== this.data.cor || oldData.repeat !== this.data.repeat) {
                    this.aplicarTextura();
                }
            },
            aplicarTextura: function() {
                this.el.setAttribute('material', {
                    shader: 'flat',                    
                    src: texturaGridNeon(this.data.cor),
                    repeat: this.data.repeat
                });
            }
        });

        AFRAME.registerComponent('painel-proximidade', {
            init: function () {
                this.ativo = false;
                this.tela = this.el.querySelector('.tela-info');
                this.worldPosJogador = new THREE.Vector3();
                this.jogadorEl = document.querySelector('#camera-jogador');
            },
            tick: function () {
                if (!this.jogadorEl || !this.tela) return;
                this.jogadorEl.object3D.getWorldPosition(this.worldPosJogador);
                var posLocal = this.worldPosJogador.clone();
                this.el.object3D.worldToLocal(posLocal);

                var eixoZTestado = posLocal.z - 2.0; 
                var a = 3.0; 
                var b = 5.0; 
                var dentroElipse = ((posLocal.x * posLocal.x) / (a * a)) + ((eixoZTestado * eixoZTestado) / (b * b)) <= 1.0;

                if (dentroElipse && !this.ativo) {
                    this.ativo = true;
                    this.tela.setAttribute('animation', 'property: scale; to: 1 1 1; dur: 400; easing: easeOutElastic');
                } 
                else if (!dentroElipse && this.ativo) {
                    this.ativo = false;
                    this.tela.setAttribute('animation', 'property: scale; to: 0 0 0; dur: 200; easing: easeOutQuad');
                }
            }
        });

        AFRAME.registerComponent('gerador-de-salas', {
            init: function () {
                var self = this;
                var centro = this.el;
                
                // Variáveis de Estado do Jogo
                this.corApagada = '#222233'; 
                this.corCoroa = '#ffee00';
                this.lightsOutState = new Array(10).fill(false);
                this.terminalStep = 0; 
                this.senhas = ["1", "2", "3", "4"]; // Senhas para os 4 anéis
                this.inputAtual = "";
                
                this.aneisCupula = [];
                this.totensCores = []; 

                // Variáveis Mão na Obra (Arquitetura)
                var raioRotunda = 20.0;     
                var alturaImposta = 6.0; 
                
                var anguloRad = 18 * (Math.PI / 180);
                var pX = raioRotunda * Math.sin(anguloRad); 
                var pZ = -(raioRotunda * Math.cos(anguloRad)); 
                
                var alturaTopoArcos = alturaImposta + pX + 0.1; 
                var raioTuboAro = 0.15;
                var alturaAro = alturaTopoArcos + raioTuboAro; 
                
                var raioOculus = raioRotunda * 0.25; 
                var distYOculus = Math.sqrt(Math.pow(raioRotunda, 2) - Math.pow(raioOculus, 2));
                var alturaOculus = alturaAro + distYOculus;

                var chaoCentral = document.createElement('a-circle');
                chaoCentral.setAttribute('position', '0 0 0');
                chaoCentral.setAttribute('rotation', '-90 18 0'); 
                chaoCentral.setAttribute('radius', raioRotunda.toFixed(3));
                chaoCentral.setAttribute('segments', '10');
                chaoCentral.setAttribute('piso-neon', 'cor: #00fff2; repeat: ' + (raioRotunda * 0.9).toFixed(0) + ' ' + (raioRotunda * 0.9).toFixed(0));
                centro.appendChild(chaoCentral);

                var cupulaPrincipal = document.createElement('a-sphere');
                cupulaPrincipal.setAttribute('position', '0 ' + alturaAro.toFixed(3) + ' 0');
                cupulaPrincipal.setAttribute('radius', raioRotunda.toFixed(3));
                cupulaPrincipal.setAttribute('color', '#05010f');
                cupulaPrincipal.setAttribute('material', 'side: back; roughness: 1');
                cupulaPrincipal.setAttribute('theta-length', '90');
                cupulaPrincipal.setAttribute('segments-width', '10');
                centro.appendChild(cupulaPrincipal);

                // OS 4 ANÉIS DA CÚPULA (Apagados no início)
                var aroHorizontal = document.createElement('a-torus');
                aroHorizontal.setAttribute('position', '0 ' + alturaAro.toFixed(3) + ' 0');
                aroHorizontal.setAttribute('radius', raioRotunda.toFixed(3));
                aroHorizontal.setAttribute('radius-tubular', raioTuboAro.toString());
                aroHorizontal.setAttribute('material', 'shader: flat; color: ' + this.corApagada);
                aroHorizontal.setAttribute('rotation', '90 0 0'); 
                aroHorizontal.setAttribute('segments-tubular', '10');
                centro.appendChild(aroHorizontal);

                var intervaloY = distYOculus / 3;

                var distY1 = intervaloY; 
                var raioAroInt1 = Math.sqrt(Math.pow(raioRotunda, 2) - Math.pow(distY1, 2)); 
                var alturaAroInt1 = alturaAro + distY1;
                var aroInt1 = document.createElement('a-torus');
                aroInt1.setAttribute('position', '0 ' + alturaAroInt1.toFixed(3) + ' 0');
                aroInt1.setAttribute('radius', raioAroInt1.toFixed(3));
                aroInt1.setAttribute('radius-tubular', '0.12');
                aroInt1.setAttribute('material', 'shader: flat; color: ' + this.corApagada);
                aroInt1.setAttribute('rotation', '90 0 0');
                aroInt1.setAttribute('segments-tubular', '10');
                centro.appendChild(aroInt1);

                var distY2 = intervaloY * 2; 
                var raioAroInt2 = Math.sqrt(Math.pow(raioRotunda, 2) - Math.pow(distY2, 2));
                var alturaAroInt2 = alturaAro + distY2;
                var aroInt2 = document.createElement('a-torus');
                aroInt2.setAttribute('position', '0 ' + alturaAroInt2.toFixed(3) + ' 0');
                aroInt2.setAttribute('radius', raioAroInt2.toFixed(3));
                aroInt2.setAttribute('radius-tubular', '0.12');
                aroInt2.setAttribute('material', 'shader: flat; color: ' + this.corApagada);
                aroInt2.setAttribute('rotation', '90 0 0');
                aroInt2.setAttribute('segments-tubular', '10');
                centro.appendChild(aroInt2);

                var anelCentral = document.createElement('a-torus');
                anelCentral.setAttribute('position', '0 ' + alturaOculus.toFixed(3) + ' 0');
                anelCentral.setAttribute('radius', raioOculus.toFixed(3));
                anelCentral.setAttribute('radius-tubular', '0.2');
                anelCentral.setAttribute('material', 'shader: flat; color: ' + this.corApagada);
                anelCentral.setAttribute('rotation', '90 0 0');
                anelCentral.setAttribute('segments-tubular', '10');
                centro.appendChild(anelCentral);

                this.aneisCupula.push(aroHorizontal);
                this.aneisCupula.push(aroInt1);
                this.aneisCupula.push(aroInt2);
                this.aneisCupula.push(anelCentral);

                for (let i = 0; i < 10; i++) {
                    var angulo = i * 36; 
                    var conteudo = conteudosMuseu[i];
                    var corNeon = conteudo.cor; 
                    
                    var ala = document.createElement('a-entity');
                    ala.setAttribute('rotation', '0 ' + angulo + ' 0');
                    
                    // CONTÊINER DA ARQUITETURA DA ÊXEDRA (Visível apenas após puzzle final)
                    var grupoArq = document.createElement('a-entity');
                    grupoArq.setAttribute('position', '0 0 ' + pZ.toFixed(3));
                    grupoArq.setAttribute('scale', '0 0 0');

                    var exedraParede = document.createElement('a-cylinder');
                    exedraParede.setAttribute('position', '0 ' + (alturaImposta/2) + ' 0');
                    exedraParede.setAttribute('radius', pX.toFixed(3)); 
                    exedraParede.setAttribute('height', alturaImposta);
                    exedraParede.setAttribute('theta-start', '90');    
                    exedraParede.setAttribute('theta-length', '180');  
                    exedraParede.setAttribute('material', 'side: double; color: #030008; roughness: 0.9');
                    exedraParede.setAttribute('open-ended', 'true');
                    grupoArq.appendChild(exedraParede);

                    var exedraCupula = document.createElement('a-sphere');
                    exedraCupula.setAttribute('position', '0 ' + alturaImposta + ' 0');
                    exedraCupula.setAttribute('radius', pX.toFixed(3));
                    exedraCupula.setAttribute('theta-start', '0');   
                    exedraCupula.setAttribute('theta-length', '90');
                    exedraCupula.setAttribute('phi-start', '0');    
                    exedraCupula.setAttribute('phi-length', '-180');  
                    exedraCupula.setAttribute('material', 'color: #05010f; roughness: 0.9');
                    grupoArq.appendChild(exedraCupula);

                    var pilarDir = document.createElement('a-cylinder');
                    pilarDir.setAttribute('position', pX.toFixed(3) + ' ' + (alturaAro / 2).toFixed(3) + ' 0');
                    pilarDir.setAttribute('radius', '0.35'); pilarDir.setAttribute('height', alturaAro.toFixed(3));
                    pilarDir.setAttribute('material', 'shader: flat; color: ' + corNeon);
                    grupoArq.appendChild(pilarDir);

                    var baseDir = document.createElement('a-cylinder');
                    baseDir.setAttribute('position', pX.toFixed(3) + ' 0.5 0');
                    baseDir.setAttribute('radius', '0.5'); baseDir.setAttribute('height', '1');
                    baseDir.setAttribute('color', '#0c0c18');
                    grupoArq.appendChild(baseDir);

                    var arcoEntrada = document.createElement('a-torus');
                    arcoEntrada.setAttribute('position', '0 ' + alturaImposta + ' 0');
                    arcoEntrada.setAttribute('radius', pX.toFixed(3)); arcoEntrada.setAttribute('radius-tubular', '0.1');
                    arcoEntrada.setAttribute('arc', '180'); arcoEntrada.setAttribute('material', 'shader: flat; color: ' + corNeon);
                    grupoArq.appendChild(arcoEntrada);

                    var cornija = document.createElement('a-torus');
                    cornija.setAttribute('position', '0 ' + alturaImposta + ' 0');
                    cornija.setAttribute('radius', (pX - 0.05).toFixed(3)); cornija.setAttribute('radius-tubular', '0.05');
                    cornija.setAttribute('arc', '180'); cornija.setAttribute('rotation', '-90 0 0');
                    cornija.setAttribute('material', 'shader: flat; color: ' + corNeon);
                    grupoArq.appendChild(cornija);

                    var faixaDir = document.createElement('a-cylinder');
                    faixaDir.setAttribute('position', pX.toFixed(3) + ' ' + (alturaAro / 2).toFixed(3) + ' 0.05');
                    faixaDir.setAttribute('radius', '0.1'); faixaDir.setAttribute('height', alturaAro.toFixed(3));
                    faixaDir.setAttribute('material', 'shader: flat; color: ' + corNeon);
                    grupoArq.appendChild(faixaDir);

                    var anguloOculusRad = Math.asin(raioOculus / raioRotunda); 
                    var arcoGrausNervura = 90 - (anguloOculusRad * 180 / Math.PI); 

                    var arcoNervura = document.createElement('a-torus');
                    arcoNervura.setAttribute('position', '0 ' + alturaAro.toFixed(3) + ' ' + (-pZ).toFixed(3)); 
                    arcoNervura.setAttribute('radius', raioRotunda.toFixed(3)); 
                    arcoNervura.setAttribute('radius-tubular', '0.06'); 
                    arcoNervura.setAttribute('arc', arcoGrausNervura.toFixed(2)); 
                    arcoNervura.setAttribute('rotation', '0 72 0'); 
                    arcoNervura.setAttribute('material', 'shader: flat; color: ' + corNeon);
                    arcoNervura.setAttribute('segments-tubular', '42');
                    grupoArq.appendChild(arcoNervura);
                    ala.appendChild(grupoArq);

                    var exedraChao = document.createElement('a-circle');
                    exedraChao.setAttribute('position', '0 0.105 ' + pZ);
                    exedraChao.setAttribute('radius', pX.toFixed(3));
                    exedraChao.setAttribute('rotation', '-90 0 0');
                    exedraChao.setAttribute('piso-neon', 'cor: ' + this.corApagada + '; repeat: 4 4');
                    ala.appendChild(exedraChao);

                    var raioPlataforma = pX; 
                    var alturaPlataforma = 0.1; 
                    
                    var plataformaChao = document.createElement('a-cylinder');
                    plataformaChao.setAttribute('position', '0 ' + (alturaPlataforma / 2).toFixed(3) + ' ' + pZ);
                    plataformaChao.setAttribute('radius', raioPlataforma.toFixed(3));
                    plataformaChao.setAttribute('height', alturaPlataforma.toFixed(3));
                    plataformaChao.setAttribute('material', 'color: #0c0c18; roughness: 0.8');
                    ala.appendChild(plataformaChao);

                    var bordaPlataforma = document.createElement('a-torus');
                    bordaPlataforma.setAttribute('position', '0 ' + alturaPlataforma.toFixed(3) + ' ' + pZ);
                    bordaPlataforma.setAttribute('radius', raioPlataforma.toFixed(3));
                    bordaPlataforma.setAttribute('radius-tubular', '0.03');
                    bordaPlataforma.setAttribute('rotation', '90 0 0');
                    bordaPlataforma.setAttribute('material', 'shader: flat; color: ' + this.corApagada);
                    ala.appendChild(bordaPlataforma);

                    var listraNeon = document.createElement('a-cylinder');
                    listraNeon.setAttribute('position', '0 1 ' + pZ);
                    listraNeon.setAttribute('radius', (pX - 0.01).toFixed(3));
                    listraNeon.setAttribute('height', '0.04');
                    listraNeon.setAttribute('theta-start', '90'); listraNeon.setAttribute('theta-length', '180');
                    listraNeon.setAttribute('material', 'shader: flat; color: ' + this.corApagada + '; side: double');
                    listraNeon.setAttribute('open-ended', 'true');
                    ala.appendChild(listraNeon);

                    var zBordaMonumento = -(raioRotunda * 0.16); 
                    var zTotem = zBordaMonumento - 0.3; 
                    
                    var totemBotao = document.createElement('a-entity');
                    totemBotao.setAttribute('position', '0 0 ' + zTotem.toFixed(3));
                    totemBotao.setAttribute('rotation', '0 180 0'); 
                    
                    var baseTotem = document.createElement('a-cylinder');
                    baseTotem.setAttribute('radius', '0.3'); baseTotem.setAttribute('height', '0.08'); baseTotem.setAttribute('position', '0 0.04 0'); baseTotem.setAttribute('color', '#080810');
                    totemBotao.appendChild(baseTotem);
                    
                    var anelBaseTotem = document.createElement('a-torus');
                    anelBaseTotem.setAttribute('radius', '0.3'); anelBaseTotem.setAttribute('radius-tubular', '0.01'); anelBaseTotem.setAttribute('position', '0 0.08 0'); anelBaseTotem.setAttribute('rotation', '90 0 0'); 
                    anelBaseTotem.setAttribute('material', 'shader: flat; color: ' + this.corApagada);
                    totemBotao.appendChild(anelBaseTotem);
                    
                    var corpoTotem = document.createElement('a-cylinder');
                    corpoTotem.setAttribute('radius', '0.22'); corpoTotem.setAttribute('height', '1.1'); corpoTotem.setAttribute('position', '0 0.63 0'); corpoTotem.setAttribute('color', '#12121f');
                    totemBotao.appendChild(corpoTotem);

                    var faixaTotem = document.createElement('a-plane');
                    faixaTotem.setAttribute('width', '0.05'); faixaTotem.setAttribute('height', '0.9'); faixaTotem.setAttribute('position', '0 0.63 0.221'); 
                    faixaTotem.setAttribute('material', 'shader: flat; color: ' + this.corApagada);
                    totemBotao.appendChild(faixaTotem);

                    var cabecaTotem = document.createElement('a-entity');
                    cabecaTotem.setAttribute('position', '0 1.18 0'); cabecaTotem.setAttribute('rotation', '-20 180 0'); 
                    
                    var cilindroCabeca = document.createElement('a-cylinder');
                    cilindroCabeca.setAttribute('radius', '0.22'); cilindroCabeca.setAttribute('height', '0.15'); cilindroCabeca.setAttribute('color', '#0c0c18');
                    cabecaTotem.appendChild(cilindroCabeca);

                    // O Anel ao redor do botão (com pulso orgânico)
                    var aroBotao = document.createElement('a-torus');
                    aroBotao.setAttribute('radius', '0.22'); aroBotao.setAttribute('radius-tubular', '0.015'); aroBotao.setAttribute('position', '0 0.075 0'); aroBotao.setAttribute('rotation', '90 0 0');
                    aroBotao.setAttribute('material', 'shader: flat; color: #333');
                    // Animação de pulso adormecido (Será controlada dinamicamente)
                    aroBotao.setAttribute('animation__pulse', 'property: material.color; from: #111; to: ' + corNeon + '; dir: alternate; loop: true; dur: 1200; easing: easeInOutSine');
                    cabecaTotem.appendChild(aroBotao);

                    var botaoFisico = document.createElement('a-cylinder');
                    botaoFisico.classList.add('interactable'); 
                    botaoFisico.setAttribute('radius', '0.16'); botaoFisico.setAttribute('height', '0.06'); botaoFisico.setAttribute('position', '0 0.08 0');
                    botaoFisico.setAttribute('material', 'shader: flat; color: ' + this.corApagada);
                    
                    botaoFisico.addEventListener('click', (function(idx) {
                        return function() { self.processarLightsOut(idx); };
                    })(i));

                    cabecaTotem.appendChild(botaoFisico);
                    totemBotao.appendChild(cabecaTotem);
                    ala.appendChild(totemBotao);

                    var zBordaPlataforma = pZ + raioPlataforma; 
                    var comprimentoLinha = Math.abs(zBordaPlataforma - zTotem);
                    
                    var linhaPivot = document.createElement('a-entity');
                    linhaPivot.setAttribute('position', '0 0.01 ' + zTotem.toFixed(3));
                    linhaPivot.setAttribute('scale', '1 1 0.001');

                    var linhaCentro = document.createElement('a-plane');
                    linhaCentro.setAttribute('position', '0 0 ' + (-comprimentoLinha/2).toFixed(3));
                    linhaCentro.setAttribute('width', '0.25'); 
                    linhaCentro.setAttribute('height', comprimentoLinha.toFixed(3));
                    linhaCentro.setAttribute('rotation', '-90 0 0');
                    linhaCentro.setAttribute('material', 'shader: flat; color: ' + corNeon);
                    
                    linhaPivot.appendChild(linhaCentro);
                    ala.appendChild(linhaPivot);

                    var grupoCont = document.createElement('a-entity');
                    grupoCont.setAttribute('position', '0 0 ' + pZ.toFixed(3));
                    grupoCont.setAttribute('scale', '0 0 0');

                    if (i < 9) {
                        var zPedestalLocal = -(raioRotunda * 0.15); 
                        var expos = [
                            { d: conteudo.esq, x: -2.8, z: zPedestalLocal, rot: 20 },
                            { d: conteudo.dir, x: 2.8, z: zPedestalLocal, rot: -20 }

                        expos.forEach(function (ex) {
                            var ped = document.createElement('a-entity');
                            ped.setAttribute('position', ex.x + ' 0.1 ' + ex.z);
                            ped.setAttribute('rotation', '0 ' + ex.rot + ' 0');
                            
                            var base = document.createElement('a-box'); base.setAttribute('position', '0 0.6 0'); base.setAttribute('width', '1.0'); base.setAttribute('height', '1.2'); base.setAttribute('depth', '1.0'); base.setAttribute('color', '#12121f'); ped.appendChild(base);
                            var topo = document.createElement('a-box'); topo.setAttribute('position', '0 1.22 0'); topo.setAttribute('width', '1.05'); topo.setAttribute('height', '0.06'); topo.setAttribute('depth', '1.05'); topo.setAttribute('material', 'shader: flat; color: ' + corNeon); ped.appendChild(topo);
                            var raioEsq = document.createElement('a-circle'); raioEsq.setAttribute('position', '0 0.02 2'); raioEsq.setAttribute('radius', '2.5'); raioEsq.setAttribute('scale', '1 1.5 1'); raioEsq.setAttribute('rotation', '-90 0 0'); raioEsq.setAttribute('material', 'shader: flat; color: #00fff2; opacity: 0.12; transparent: true'); ped.appendChild(raioEsq);
                            
                            var tela = document.createElement('a-entity');
                            tela.classList.add('tela-info');
                            tela.setAttribute('position', '0 2.1 0');
                            tela.setAttribute('scale', '0 0 0'); 
                            var fundo = document.createElement('a-plane'); fundo.setAttribute('width', '2.0'); fundo.setAttribute('height', '1.4'); fundo.setAttribute('material', 'shader: flat; color: #06060f; opacity: 0.95; transparent: true'); tela.appendChild(fundo);
                            var moldura = document.createElement('a-plane'); moldura.setAttribute('width', '2.1'); moldura.setAttribute('height', '1.5'); moldura.setAttribute('position', '0 0 -0.01'); moldura.setAttribute('material', 'shader: flat; color: ' + corNeon); tela.appendChild(moldura);

                            var titulo = document.createElement('a-entity'); titulo.setAttribute('troika-text', 'value: ' + ex.d.titulo + '; color: ' + corNeon + '; align: center; fontSize: 0.16; maxWidth: 1.9'); titulo.setAttribute('position', '0 0.42 0.02'); tela.appendChild(titulo);
                            var corpo = document.createElement('a-entity'); corpo.setAttribute('troika-text', 'value: ' + ex.d.texto + '; color: #ffffff; align: center; fontSize: 0.085; maxWidth: 1.8; lineHeight: 1.2'); corpo.setAttribute('position', '0 -0.05 0.02'); tela.appendChild(corpo);

                            ped.appendChild(tela);
                            ped.setAttribute('painel-proximidade', ''); 
                            grupoCont.appendChild(ped);
                        });

                        var totemArcade = document.createElement('a-entity');
                        var zArcadeLocal = -(raioRotunda * 0.255);
                        totemArcade.setAttribute('position', '0 0.1 ' + zArcadeLocal.toFixed(3)); 
                        totemArcade.setAttribute('scale', '0.85 0.85 0.85');
                        
                        var pernaEsq = document.createElement('a-box'); pernaEsq.setAttribute('position', '-1.45 2.4 0.4'); pernaEsq.setAttribute('width', '0.1'); pernaEsq.setAttribute('height', '4.8'); pernaEsq.setAttribute('depth', '1.2'); pernaEsq.setAttribute('color', '#080810'); totemArcade.appendChild(pernaEsq);
                        var pernaDir = document.createElement('a-box'); pernaDir.setAttribute('position', '1.45 2.4 0.4'); pernaDir.setAttribute('width', '0.1'); pernaDir.setAttribute('height', '4.8'); pernaDir.setAttribute('depth', '1.2'); pernaDir.setAttribute('color', '#080810'); totemArcade.appendChild(pernaDir);

                        var painelMeio = document.createElement('a-plane'); painelMeio.setAttribute('position', '0 3.0 0.2'); painelMeio.setAttribute('width', '2.8'); painelMeio.setAttribute('height', '2.1'); painelMeio.setAttribute('material', 'shader: flat; color: #1a1a33');
                        var areaVideo = document.createElement('a-plane'); areaVideo.setAttribute('position', '0 0.35 0.01'); areaVideo.setAttribute('width', '2.4'); areaVideo.setAttribute('height', '1.35'); areaVideo.setAttribute('color', '#000000'); painelMeio.appendChild(areaVideo);
                        var textoVideo = document.createElement('a-entity'); textoVideo.setAttribute('troika-text', 'value: [ ESPAÇO PARA VÍDEO ]; color: #444444; align: center; fontSize: 0.15'); textoVideo.setAttribute('position', '0 0 0.02'); areaVideo.appendChild(textoVideo);
                        var textoMeio = document.createElement('a-entity'); textoMeio.setAttribute('troika-text', 'value: Resumo histórico e principais inovações da ' + conteudo.sala + '...\n(Texto dinâmico do carrossel); color: #00fff2; align: center; fontSize: 0.1; maxWidth: 2.5; lineHeight: 1.2'); textoMeio.setAttribute('position', '0 -0.6 0.01'); painelMeio.appendChild(textoMeio); totemArcade.appendChild(painelMeio);

                        var painelCima = document.createElement('a-plane'); painelCima.setAttribute('position', '0 4.396 0.4'); painelCima.setAttribute('rotation', '30 0 0'); painelCima.setAttribute('width', '2.8'); painelCima.setAttribute('height', '0.8'); painelCima.setAttribute('material', 'shader: flat; color: ' + corNeon); 
                        var textoCima = document.createElement('a-entity'); textoCima.setAttribute('troika-text', 'value: ' + conteudo.sala.toUpperCase() + '\n( ' + conteudo.ano + ' ); color: #05010f; align: center; fontSize: 0.22; maxWidth: 2.6'); textoCima.setAttribute('position', '0 0 0.01'); painelCima.appendChild(textoCima); totemArcade.appendChild(painelCima);

                        var painelBaixo = document.createElement('a-plane'); painelBaixo.setAttribute('position', '0 1.596 0.554'); painelBaixo.setAttribute('rotation', '-45 0 0'); painelBaixo.setAttribute('width', '2.8'); painelBaixo.setAttribute('height', '1.0'); painelBaixo.setAttribute('color', '#080810'); 
                        var detalheMesa = document.createElement('a-plane'); detalheMesa.setAttribute('position', '0 0 0.01'); detalheMesa.setAttribute('width', '2.7'); detalheMesa.setAttribute('height', '0.9'); detalheMesa.setAttribute('material', 'shader: flat; color: ' + corNeon); painelBaixo.appendChild(detalheMesa);
                        var fundoMesa = document.createElement('a-plane'); fundoMesa.setAttribute('position', '0 0 0.02'); fundoMesa.setAttribute('width', '2.6'); fundoMesa.setAttribute('height', '0.8'); fundoMesa.setAttribute('color', '#05010f'); painelBaixo.appendChild(fundoMesa);

                        var btnPrev = document.createElement('a-circle'); btnPrev.setAttribute('position', '-0.6 0 0.03'); btnPrev.setAttribute('radius', '0.15'); btnPrev.setAttribute('color', '#0a0a15');
                        var ringPrev = document.createElement('a-ring'); ringPrev.setAttribute('radius-inner', '0.13'); ringPrev.setAttribute('radius-outer', '0.15'); ringPrev.setAttribute('position', '0 0 0.01'); ringPrev.setAttribute('material', 'shader: flat; color: ' + corNeon); btnPrev.appendChild(ringPrev);
                        var iconPrev = document.createElement('a-triangle'); iconPrev.setAttribute('vertex-a', '0 0.07 0'); iconPrev.setAttribute('vertex-b', '-0.07 -0.07 0'); iconPrev.setAttribute('vertex-c', '0.07 -0.07 0'); iconPrev.setAttribute('rotation', '0 0 90'); iconPrev.setAttribute('position', '-0.02 0 0.02'); iconPrev.setAttribute('material', 'shader: flat; color: ' + corNeon); btnPrev.appendChild(iconPrev);
                        var barPrev = document.createElement('a-plane'); barPrev.setAttribute('width', '0.04'); barPrev.setAttribute('height', '0.14'); barPrev.setAttribute('position', '-0.08 0 0.02'); barPrev.setAttribute('material', 'shader: flat; color: ' + corNeon); btnPrev.appendChild(barPrev); painelBaixo.appendChild(btnPrev);

                        var btnPlay = document.createElement('a-circle'); btnPlay.setAttribute('position', '0 0 0.03'); btnPlay.setAttribute('radius', '0.15'); btnPlay.setAttribute('color', '#0a0a15');
                        var ringPlay = document.createElement('a-ring'); ringPlay.setAttribute('radius-inner', '0.13'); ringPlay.setAttribute('radius-outer', '0.15'); ringPlay.setAttribute('position', '0 0 0.01'); ringPlay.setAttribute('material', 'shader: flat; color: ' + corNeon); btnPlay.appendChild(ringPlay);
                        var iconPlay = document.createElement('a-triangle'); iconPlay.setAttribute('vertex-a', '0 0.07 0'); iconPlay.setAttribute('vertex-b', '-0.07 -0.07 0'); iconPlay.setAttribute('vertex-c', '0.07 -0.07 0'); iconPlay.setAttribute('rotation', '0 0 -90'); iconPlay.setAttribute('position', '0.02 0 0.02'); iconPlay.setAttribute('material', 'shader: flat; color: ' + corNeon); btnPlay.appendChild(iconPlay); painelBaixo.appendChild(btnPlay);

                        var btnNext = document.createElement('a-circle'); btnNext.setAttribute('position', '0.6 0 0.03'); btnNext.setAttribute('radius', '0.15'); btnNext.setAttribute('color', '#0a0a15');
                        var ringNext = document.createElement('a-ring'); ringNext.setAttribute('radius-inner', '0.13'); ringNext.setAttribute('radius-outer', '0.15'); ringNext.setAttribute('position', '0 0 0.01'); ringNext.setAttribute('material', 'shader: flat; color: ' + corNeon); btnNext.appendChild(ringNext);
                        var iconNext = document.createElement('a-triangle'); iconNext.setAttribute('vertex-a', '0 0.07 0'); iconNext.setAttribute('vertex-b', '-0.07 -0.07 0'); iconNext.setAttribute('vertex-c', '0.07 -0.07 0'); iconNext.setAttribute('rotation', '0 0 -90'); iconNext.setAttribute('position', '0.02 0 0.02'); iconNext.setAttribute('material', 'shader: flat; color: ' + corNeon); btnNext.appendChild(iconNext);
                        var barNext = document.createElement('a-plane'); barNext.setAttribute('width', '0.04'); barNext.setAttribute('height', '0.14'); barNext.setAttribute('position', '0.08 0 0.02'); barNext.setAttribute('material', 'shader: flat; color: ' + corNeon); btnNext.appendChild(barNext); painelBaixo.appendChild(btnNext);
                        
                        totemArcade.appendChild(painelBaixo);
                        grupoCont.appendChild(totemArcade);
                    } else {
                        // TERMINAL HIDDEN IN ROOM 10
                        this.construirTerminalCentral(grupoCont);
                    }

                    ala.appendChild(grupoCont);

                    this.totensCores.push({ 
                        anelBase: anelBaseTotem, faixa: faixaTotem, btn: botaoFisico, aroBotao: aroBotao,
                        pisoCirc: exedraChao, bordaPlat: bordaPlataforma, listra: listraNeon,
                        linhaPivot: linhaPivot,
                        arqEntity: grupoArq, conteudoEntity: grupoCont, 
                        corOriginal: corNeon, timerID: null 
                    });

                    centro.appendChild(ala);
                }

                // Garante que o jogo comece piscando convidativamente
                this.atualizarPulsos();
            },

            construirTerminalCentral: function(containerLocal) {
                var self = this;
                
                // Pedestal Tecnológico do Terminal
                var estante = document.createElement('a-entity');
                estante.setAttribute('position', '0 0.1 -1.5'); 
                
                var pilar = document.createElement('a-cylinder');
                pilar.setAttribute('position', '0 0.5 0'); pilar.setAttribute('radius', '0.3'); pilar.setAttribute('height', '1.0'); pilar.setAttribute('color', '#0c0c18');
                estante.appendChild(pilar);
                
                var anel = document.createElement('a-torus');
                anel.setAttribute('position', '0 1.0 0'); anel.setAttribute('rotation', '90 0 0'); anel.setAttribute('radius', '0.3'); anel.setAttribute('radius-tubular', '0.02'); anel.setAttribute('material', 'shader: flat; color: #00fff2');
                estante.appendChild(anel);

                var painelTerm = document.createElement('a-entity');
                painelTerm.setAttribute('position', '0 1.6 0.1'); 
                painelTerm.setAttribute('rotation', '-20 0 0'); 
                
                var fundo = document.createElement('a-plane');
                fundo.setAttribute('width', '0.7'); fundo.setAttribute('height', '0.9'); fundo.setAttribute('color', '#080810');
                painelTerm.appendChild(fundo);

                var display = document.createElement('a-plane');
                display.setAttribute('position', '0 0.3 0.01'); display.setAttribute('width', '0.6'); display.setAttribute('height', '0.18'); display.setAttribute('color', '#000000');
                this.textoDisplay = document.createElement('a-entity');
                this.textoDisplay.setAttribute('troika-text', 'value: SENHA ' + (this.terminalStep + 1) + ':\n_ _ _; color: #00fff2; align: left; fontSize: 0.055');
                this.textoDisplay.setAttribute('position', '-0.27 0 0.01');
                display.appendChild(this.textoDisplay);
                painelTerm.appendChild(display);

                var botoesInfo = [
                    { t: '1', x: -0.15, y: 0.05 }, { t: '2', x: 0, y: 0.05 }, { t: '3', x: 0.15, y: 0.05 },
                    { t: '4', x: -0.15, y: -0.1 }, { t: '5', x: 0, y: -0.1 }, { t: '6', x: 0.15, y: -0.1 },
                    { t: '7', x: -0.15, y: -0.25 }, { t: '8', x: 0, y: -0.25 }, { t: '9', x: 0.15, y: -0.25 },
                    { t: 'C', x: -0.15, y: -0.4, c: '#ff2d55' }, { t: '0', x: 0, y: -0.4 }, { t: 'V', x: 0.15, y: -0.4, c: '#39ff14' }
                ];

                botoesInfo.forEach(function(b) {
                    var btnBox = document.createElement('a-box');
                    btnBox.setAttribute('position', b.x + ' ' + b.y + ' 0.01'); btnBox.setAttribute('width', '0.1'); btnBox.setAttribute('height', '0.1'); btnBox.setAttribute('depth', '0.02'); btnBox.setAttribute('color', '#12121f');
                    btnBox.classList.add('interactable'); 

                    var textBtn = document.createElement('a-entity');
                    var corT = b.c ? b.c : '#ffffff';
                    textBtn.setAttribute('troika-text', 'value: ' + b.t + '; color: ' + corT + '; align: center; fontSize: 0.06');
                    textBtn.setAttribute('position', '0 0 0.015'); btnBox.appendChild(textBtn);

                    btnBox.addEventListener('click', function() { self.cliqueTerminal(b.t); });
                    painelTerm.appendChild(btnBox);
                });

                estante.appendChild(painelTerm);
                containerLocal.appendChild(estante);
            },

            atualizarPulsos: function() {
                var ativas = this.lightsOutState.filter(function(s) { return s; }).length;
                var autoStart = (ativas === 0);
                
                this.totensCores.forEach(function(props) {
                    if (autoStart) {
                        props.aroBotao.setAttribute('animation__pulse', 'enabled', 'true');
                    } else {
                        props.aroBotao.setAttribute('animation__pulse', 'enabled', 'false');
                        props.aroBotao.setAttribute('material', 'color', '#333');
                    }
                });
            },

            processarLightsOut: function(indexApertado) {
                if (this.terminalStep >= 4) {
                    var anguloAlaRad = indexApertado * 36 * (Math.PI / 180);
                    var raioTeleporte = 16.0; 
                    var tX = raioTeleporte * Math.sin(anguloAlaRad);
                    var tZ = -raioTeleporte * Math.cos(anguloAlaRad);
                    
                    var rig = document.querySelector('#rig');
                    rig.setAttribute('animation', 'property: position; to: ' + tX.toFixed(3) + ' 1.6 ' + tZ.toFixed(3) + '; dur: 1000; easing: easeInOutQuad');
                    return;
                }

                var esq = (indexApertado - 1 + 10) % 10;
                var dir = (indexApertado + 1) % 10;
                
                this.inverterEstado(esq);
                this.inverterEstado(indexApertado);
                this.inverterEstado(dir);

                // Quando o jogador clica, paramos os pulsos de tutorial
                this.atualizarPulsos();
            },

            inverterEstado: function(idx) {
                this.lightsOutState[idx] = !this.lightsOutState[idx];
                this.aplicarEstadoVisual(idx, this.lightsOutState[idx]);
            },

            aplicarEstadoVisual: function(idx, ligado) {
                var props = this.totensCores[idx];
                var self = this;
                var acessoTotal = this.terminalStep >= 4;

                if (props.timerID) clearTimeout(props.timerID);

                if(ligado) {
                    props.anelBase.setAttribute('material', 'color', props.corOriginal);
                    props.faixa.setAttribute('material', 'color', props.corOriginal);
                    props.btn.setAttribute('material', 'color', props.corOriginal);
                    
                    props.linhaPivot.setAttribute('animation', 'property: scale; to: 1 1 1; dur: 600; easing: easeOutQuad');
                    
                    props.timerID = setTimeout(function() {
                        props.pisoCirc.setAttribute('piso-neon', 'cor', props.corOriginal); 
                        props.bordaPlat.setAttribute('material', 'color', props.corOriginal);
                        props.listra.setAttribute('material', 'color', props.corOriginal);

                        // A arquitetura da sala oculta DEVE subir para ser revelada
                        if(acessoTotal) {
                            props.arqEntity.setAttribute('animation', 'property: scale; to: 1 1 1; dur: 1800; easing: easeOutElastic');
                        }
                        // O conteúdo sobe apenas com o botão ou acesso total
                        if(props.conteudoEntity) {
                            props.conteudoEntity.setAttribute('animation', 'property: scale; to: 1 1 1; dur: 1200; easing: easeOutElastic');
                        }
                    }, 600);
                    
                } else {
                    props.pisoCirc.setAttribute('piso-neon', 'cor', this.corApagada); 
                    props.bordaPlat.setAttribute('material', 'color', this.corApagada);
                    props.listra.setAttribute('material', 'color', this.corApagada);

                    props.arqEntity.setAttribute('animation', 'property: scale; to: 0 0 0; dur: 800; easing: easeInQuad');
                    if(props.conteudoEntity) {
                        props.conteudoEntity.setAttribute('animation', 'property: scale; to: 0 0 0; dur: 400; easing: easeInQuad');
                    }

                    props.linhaPivot.setAttribute('animation', 'property: scale; to: 1 1 0.001; dur: 600; easing: easeInQuad');
                    
                    props.timerID = setTimeout(function() {
                        props.anelBase.setAttribute('material', 'color', self.corApagada);
                        props.faixa.setAttribute('material', 'color', self.corApagada);
                        props.btn.setAttribute('material', 'color', self.corApagada);
                    }, 600);
                }
            },

            cliqueTerminal: function(tecla) {
                if(this.terminalStep >= 4) {
                    if(tecla === 'C') this.resetJogo();
                    return; 
                }

                if(tecla === 'C') {
                    this.inputAtual = "";
                } else if(tecla === 'V') {
                    if(this.inputAtual === this.senhas[this.terminalStep]) {
                        this.aneisCupula[this.terminalStep].setAttribute('material', 'color', this.corCoroa);
                        this.terminalStep++;
                        this.inputAtual = "";
                        
                        if(this.terminalStep === 4) {
                            this.textoDisplay.setAttribute('troika-text', 'value: ACESSO TOTAL!\nSISTEMA ONLINE\n[ C ] P/ REINICIAR; color: #39ff14; align: center; fontSize: 0.045');
                            this.textoDisplay.setAttribute('position', '0 0 0.01');
                            
                            for(var a = 0; a < 10; a++) {
                                this.lightsOutState[a] = true;
                                this.aplicarEstadoVisual(a, true);
                            }
                            this.atualizarPulsos();
                        }
                    } else {
                        this.inputAtual = "";
                        this.textoDisplay.setAttribute('troika-text', 'value: ERRO!; color: #ff2d55');
                        var self = this;
                        setTimeout(function(){ self.atualizarDisplay(); }, 1000);
                        return;
                    }
                } else {
                    if(this.inputAtual.length < 5) this.inputAtual += tecla;
                }
                this.atualizarDisplay();
            },

            atualizarDisplay: function() {
                if(this.terminalStep < 4) {
                    var displayVis = this.inputAtual.length > 0 ? this.inputAtual : '_ _ _';
                    this.textoDisplay.setAttribute('troika-text', 'value: SENHA ' + (this.terminalStep + 1) + ':\n' + displayVis + '; color: #00fff2; align: left; fontSize: 0.055');
                    this.textoDisplay.setAttribute('position', '-0.27 0 0.01');
                }
            },

            resetJogo: function() {
                this.terminalStep = 0;
                this.inputAtual = "";
                this.atualizarDisplay();
                
                for(var r = 0; r < 4; r++) {
                    this.aneisCupula[r].setAttribute('material', 'color', this.corApagada);
                }

                for(var a = 0; a < 10; a++) {
                    this.lightsOutState[a] = false;
                    this.aplicarEstadoVisual(a, false);
                }

                // Traz o jogador de volta para o centro
                var rig = document.querySelector('#rig');
                rig.setAttribute('animation', 'property: position; to: 0 1.6 8; dur: 1500; easing: easeInOutQuad');

                this.atualizarPulsos();
            }
        });
    </script>
</head>
<body>
    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .interactable" renderer="antialias: true; colorManagement: true" background="color: #05010f" webxr="referenceSpaceType: local">

        <a-assets>
            <img id="logo-mgc" src="https://www.museugameciencia.com.br/assets/LogoMuseu-C0J6co-V.png" crossorigin="anonymous">
        </a-assets>

        <a-sky color="#000000"></a-sky>

        <a-entity gerador-de-salas></a-entity>

        <a-entity position="0 0 0">
            <a-cylinder position="0 0.25 0" radius="3.2" height="0.5" color="#0c0c18"></a-cylinder>
            <a-torus position="0 0.5 0" rotation="90 0 0" radius="3.2" radius-tubular="0.05" material="shader: flat; color: #00fff2"></a-torus>
            <a-cylinder position="0 1.8 0" radius="0.35" height="2.6" color="#12121f"></a-cylinder>
            <a-entity position="0 3.6 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 14000; easing: linear">
                <a-box width="0.9" height="0.9" depth="0.9" material="shader: flat; color: #ff00a0"></a-box>
                <a-torus radius="1.1" radius-tubular="0.04" rotation="70 0 0" material="shader: flat; color: #00fff2"></a-torus>
            </a-entity>
        </a-entity>

        <a-entity position="0 16 0">
            <a-box width="5.8" height="4.5" depth="5.8" color="#080810"></a-box>

            <a-entity position="0 0 3.5" rotation="10 0 0">
                <a-plane width="6" height="4.5" material="shader: flat; color: #ffffff">
                    <a-plane position="0 0 -0.01" width="6.2" height="4.7" material="shader: flat; color: #ffee00"></a-plane>
                    <a-image src="#logo-mgc" position="0 0.4 0.02" width="4.5" height="2.25" transparent="true"></a-image>
                    <a-entity troika-text="value: CONHECIMENTO, APRENDIZADO E DIVERSÃO; color: #05010f; align: center; fontSize: 0.18; maxWidth: 5" position="0 -1.4 0.02"></a-entity>
                    <a-plane position="0 1.8 0.02" width="5.4" height="0.08" color="#ffee00"></a-plane>
                    <a-plane position="0 -1.8 0.02" width="5.4" height="0.08" color="#ffee00"></a-plane>
                </a-plane>
            </a-entity>

            <a-entity position="0 0 -3.5" rotation="10 180 0">
                <a-plane width="6" height="4.5" material="shader: flat; color: #ffffff">
                    <a-plane position="0 0 -0.01" width="6.2" height="4.7" material="shader: flat; color: #ffee00"></a-plane>
                    <a-image src="#logo-mgc" position="0 0.4 0.02" width="4.5" height="2.25" transparent="true"></a-image>
                    <a-entity troika-text="value: CONHECIMENTO, APRENDIZADO E DIVERSÃO; color: #05010f; align: center; fontSize: 0.18; maxWidth: 5" position="0 -1.4 0.02"></a-entity>
                    <a-plane position="0 1.8 0.02" width="5.4" height="0.08" color="#ffee00"></a-plane>
                    <a-plane position="0 -1.8 0.02" width="5.4" height="0.08" color="#ffee00"></a-plane>
                </a-plane>
            </a-entity>
